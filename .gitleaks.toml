# gitleaks config — extend the default rules, allowlist only deliberate FAKE
# secrets used as test fixtures. These files exist to PROVE the api adapter
# (a) never leaks a real-shaped key and (b) rejects a literal key in config, and
# that the gate's security scanner (c) DETECTS a known-format key in generated
# code (#277) — so they intentionally contain key-shaped strings. They are never
# real secrets. The CI runs `gitleaks detect --source . --redact` over history, so
# this allowlist is config-based (history-wide), scoped to exactly these
# secret-handling test files.
[extend]
useDefault = true

[allowlist]
description = "Deliberate fake API keys in the adapter/endpoint test fixtures"
paths = [
  '''packages/cli/src/endpoints\.test\.ts''',
  '''packages/kernel/src/adapters/api\.test\.ts''',
  '''packages/kernel/src/adapters/api-security\.test\.ts''',
  '''packages/kernel/src/adapters/discover\.test\.ts''',
  '''packages/cli/src/tools/models\.test\.ts''',
  '''packages/docscan/src/security-scan\.test\.ts''',
]
