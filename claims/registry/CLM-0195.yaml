id: CLM-0195
statement: >-
  Agentic CLI children spawned by the canonical loop run WITH their cwd pinned
  to the run's declared workspaceDir — the SAME directory the agentic-cwd
  containment validated, carried as one binding from check to spawn so the two
  can never diverge — and a dying `kernloop run` takes its coder with it: every
  subprocess child leads its own POSIX process group, a live-group registry is
  swept with SIGTERM (`kill(-pid)`, grandchildren included) on parent exit and
  on fatal SIGTERM/SIGHUP, so a killed run leaves no orphaned agentic writer
  resolving paths against the launching repo (the #570 incident). Standalone
  verbs (gate/distill/forge) declare no workspace and keep the operator's cwd,
  unchanged; SIGINT is deliberately not swept — the first Ctrl-C is the
  cooperative abort (CLM-0144) that awaits the in-flight child, and the
  force-quit path exits through `process.exit`, which fires the sweep.
evidence:
  - 'test:packages/cli/src/loop/node-bind-cwd.test.ts::pins every CLI-adapter subprocess to the run workspace — the dir containment validated (#570)'
  - 'test:packages/cli/src/loop/node-bind-cwd.test.ts::refuses at the seam when the pinned workspace is a real git tree — check and spawn share one dir (#570)'
  - 'test:packages/cli/src/loop/node-bind-cwd.test.ts::leaves the child in the launch cwd when NO workspace is given (pure-verb paths)'
  - 'test:packages/kernel/src/adapters/invoke.test.ts::refuses the agentic spawn for the EXACT dir the child would run in — before any spawn (#570)'
  - 'test:packages/kernel/src/adapters/invoke.test.ts::runs the CLI in the invocation cwd, not the launch dir (#146)'
  - 'test:packages/kernel/src/adapters/subprocess.test.ts::sweepChildGroups SIGTERMs every live child process group — grandchild included (#570)'
  - 'test:packages/kernel/src/adapters/subprocess.test.ts::a fatal signal sweeps live child groups before the parent dies (#570)'
  - 'test:packages/kernel/src/adapters/subprocess.test.ts::a SIGTERMed parent takes the whole coder process tree with it (#570)'
  - 'ci:test'
status: verified
owner: williamzujkowski
since: 0.1.6
