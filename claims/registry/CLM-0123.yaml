id: CLM-0123
statement: >-
  The Docker sandbox primitive is a SHARED KERNEL primitive (#234, EPIC #47·P2 / #227 item 2):
  `runInSandbox`/`buildDockerArgs` and the sandbox errors live in `packages/kernel/src/sandbox/`,
  so any faculty can run model-supplied content under isolation by depending on `@kernloop/kernel`
  (faculty→kernel is permitted; rule 5 only bars faculty→faculty) — without duplicating the
  primitive. The kernel holds no intelligence (rule 4): this is process-isolation mechanism, no model
  call, and the docker binary is injectable (`dockerBin`) so the refusal path and every kernel unit
  test run hermetically (no daemon). The relocation is BEHAVIOR-PRESERVING and does NOT reopen the
  toolsmith's 6-1 ratification: the kernel validates only the generic EXECUTION knobs (a
  `SandboxExecProfile` — image/network='none'/user/workdir/memory/cpus/pidsLimit/timeoutMs), stripping
  a richer caller profile's governance fields, while `RATIFIED_SANDBOX_PROFILE` and its
  `RATIFIED_PROFILE_HASH` stay frozen in faculty-toolsmith with a byte-identical hash. The primitive
  still REFUSES (typed `SandboxUnavailableError`) when docker is absent — never an unsandboxed
  fallback — and the toolsmith's ratified profile drives the relocated primitive end-to-end.
evidence:
  - 'test:packages/kernel/src/sandbox/sandbox.test.ts::builds the full argv: no network, capped, scratch mount, workdir'
  - 'test:packages/kernel/src/sandbox/sandbox.test.ts::rejects an invalid profile at the boundary (bad memory)'
  - 'test:packages/kernel/src/sandbox/sandbox.test.ts::strips a structural superset profile (governance fields) and still validates exec knobs'
  - 'test:packages/kernel/src/sandbox/sandbox.test.ts::refuses (typed) when the docker binary is absent instead of running unsandboxed'
  - 'test:packages/kernel/src/sandbox/errors.test.ts::SandboxUnavailableError names itself and carries the detail in the message'
  - 'test:packages/faculty-toolsmith/src/sandbox.test.ts::builds the full ratified argv: no network, node user, caps, scratch mount, workdir'
  - 'test:packages/faculty-toolsmith/src/profile.test.ts::exports the sha256 of its canonical JSON as RATIFIED_PROFILE_HASH'
  - 'code:packages/kernel/src/sandbox/sandbox.ts#runInSandbox@doc:/never falls back to unsandboxed execution/'
  - 'ci:test'
status: verified
owner: williamzujkowski
since: 0.9.0
