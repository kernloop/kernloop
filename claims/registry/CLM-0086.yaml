id: CLM-0086
statement: >-
  Model discovery enumerates the models an endpoint serves via its stable PUBLIC contract — an
  OpenAI-compatible GET /v1/models (bearer key read env-only at call time) and ollama GET /api/tags
  (local, no secret) — reusing the api adapter's security primitives: the baseUrl scheme/credential
  guard runs before any egress, only the FIXED discovery path is appended, cross-host redirects are
  refused, the body is read under the same streamed size cap, and one AbortController bounds the
  request and the body read. The response is zod-validated defensively, so a non-2xx or malformed
  body is a typed error rather than a guessed model, and the key appears in no error, body, or
  surfaced string.
evidence:
  - 'test:packages/kernel/src/adapters/discover.test.ts::GETs the fixed /v1/models path with the bearer key and returns the listed ids'
  - 'test:packages/kernel/src/adapters/discover.test.ts::de-duplicates ids and drops an empty id (never a fabricated model)'
  - 'test:packages/kernel/src/adapters/discover.test.ts::fails closed (ApiKeyMissingError) when the key env var is unset, BEFORE any egress'
  - 'test:packages/kernel/src/adapters/discover.test.ts::a non-2xx is a typed AdapterExecutionError carrying the status, never a guess'
  - 'test:packages/kernel/src/adapters/discover.test.ts::a malformed 2xx body is a typed AdapterOutputError, never a crash'
  - 'test:packages/kernel/src/adapters/discover.test.ts::refuses a non-https non-local baseUrl before any network call (reuses the SSRF guard)'
  - 'test:packages/kernel/src/adapters/discover.test.ts::does not leak the key through a non-2xx error body that echoes the header'
  - 'test:packages/kernel/src/adapters/discover.test.ts::does not leak the key through a malformed body that echoes the header'
  - 'test:packages/kernel/src/adapters/discover.test.ts::GETs /api/tags WITHOUT an Authorization header and returns the tag names'
  - 'test:packages/kernel/src/adapters/discover.test.ts::a non-2xx ollama response is a typed AdapterExecutionError, never a guess'
  - 'ci:test'
status: verified
owner: williamzujkowski
since: 0.9.0
