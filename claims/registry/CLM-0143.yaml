id: CLM-0143
statement: >-
  The canonical loop supports COOPERATIVE mid-run abort (EPIC #47·P5 #304). When
  an AbortSignal threaded into the run fires, the engine halts at the NEXT node
  boundary (CLM-0044) and the run is reported as a CLEAN, resumable CANCEL — the
  run-tool Outcome status is `cancelled` (the previously-unused frozen enum value,
  no contract change), the LoopReport status is `escalated` with `haltReason:
  'aborted'`, and the in-memory spend meter is FLUSHED into the Outcome cost
  rather than lost to a dirty failure. The flushed cost RECONCILES exactly with
  the sum of the per-node `loop.spend` audit deltas (CLM-0137) — the two meters
  never diverge — the audit chain still verifies, and the checkpoint is resumable.
  A vote/budget escalate (no `haltReason`) is UNAFFECTED — it still surfaces as a
  needs-human escalation mapping to `partial`, never captured by the abort branch;
  and a run with no signal is byte-identical to before. HONESTY BOUNDARY: this
  claims abort via an INJECTED signal (the real invocable seam threaded through
  runTool → executeCanonicalLoop → engine.run) — NOT operator Ctrl-C, whose SIGINT
  process-handler trigger is a tracked fast-follow (#317). Abort takes effect only
  at a node BOUNDARY: a runaway INSIDE a single long node halts only when it
  returns (inherited CLM-0044 limitation, not immediate kill).
evidence:
  - 'test:packages/cli/src/loop-abort.test.ts::halts cleanly on an injected abort: cancelled Outcome, spend preserved + reconciled, resumable'
  - 'test:packages/cli/src/loop-abort.test.ts::a vote/budget escalate (NO haltReason) still maps to partial, not cancelled — regression guard'
  - 'test:packages/cli/src/loop-abort.test.ts::a non-aborted run is unaffected: completes normally with no haltReason'
  - 'ci:test'
status: verified
owner: williamzujkowski
since: 0.9.0
