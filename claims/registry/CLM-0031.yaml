id: CLM-0031
statement: >-
  The quality gate runs typecheck, lint, test, and coverage over a workspace and emits a structured Verdict with severity-tagged findings.
evidence:
  - 'test:packages/faculty-gates/src/run.test.ts::emits a pass verdict for a passing workspace'
  - 'test:packages/faculty-gates/src/run.test.ts::emits a fail verdict with parsed findings for typecheck-shaped failure output'
  - 'test:packages/faculty-gates/src/run.test.ts::fails with a timeout finding when a check exceeds its timeout'
  - 'test:packages/faculty-gates/src/run.test.ts::aggregates mixed severities across checks'
  - 'test:packages/faculty-gates/src/run.test.ts::emits a schema-valid verdict with zero token cost'
  - 'test:packages/faculty-gates/src/checks.test.ts::default checks cover typecheck, lint, test, the doc-comment scan, and the security scan'
  - 'test:packages/faculty-gates/src/integration.test.ts::fails a real tsc run against a workspace with a type error'
  - 'ci:test'
status: verified
owner: williamzujkowski
since: 0.2.0
