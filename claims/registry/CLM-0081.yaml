  - 'test:packages/cli/src/loop/node-seam.test.ts::a harness-default served model (empty alias) is honestly unknown'
  - 'test:packages/cli/src/loop/gates-in-loop.test.ts::provenance also names the NORMALIZED served identity (table hit) [CLM-0081]'
  - 'test:packages/cli/src/loop/gates-in-loop.test.ts::a harness-default served model normalizes to an honest unknown identity [CLM-0081]'
  - 'ci:test'
