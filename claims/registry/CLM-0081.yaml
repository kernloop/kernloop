id: CLM-0081
statement: >-
  The canonical loop records the NORMALIZED served model identity — the real model class behind the
  served alias, named family, generation, tier, and resolvedBy — in each model-calling node's
  provenance alongside the raw served ref, admitting an honest unknown for a harness-default node
  where kernloop pinned no model.
evidence:
