id: CLM-0104
statement: >-
  The quality gate runs an in-process, language-aware doc-comment scan over the
  workspace: every exported top-level TypeScript/JavaScript declaration (via the
  TS compiler API) and every public declaration in twelve tree-sitter languages —
  Python/Go/Rust/Java/C/PHP/Ruby (#108/#122) and C++/C#/Kotlin/Swift/Scala (#120),
  via in-process web-tree-sitter WASM grammars — lacking a non-empty leading
  doc-comment is an error finding (failing the Verdict, so the per-child iteration
  loop re-runs the coder). Each language's OWN visibility/doc rule is applied (Go
  uppercase-initial, Rust `pub`, Java/C# `public`, C/C++ non-`static` incl.
  typedefs/prototypes minus bodyless forward declarations, PHP/Ruby/Kotlin/Scala
  public-by-default, Swift `public`/`open` only) and, for Java/PHP/C#/C++/Kotlin/
  Scala/Swift/Ruby, each type's PUBLIC nested members (private/protected/internal
  skipped, #121/#120/#150) — Ruby tracking its STATEFUL private/protected
  directives down the class body; C#/C++ descend named namespaces.
  Ruby's arg-form visibility (`private :x`) and brace-namespace member bodies are
  NOT yet descended (honestly deferred, #150). Each REMAINING known
  source language it cannot yet parse contributes one non-blocking info finding
  (so an uncovered-language deliverable gets no doc enforcement — recorded, never
  silently passed); the scan bounds its own per-file and total bytes AND each
  single tree-sitter parse by a wall-clock budget (#123) so untrusted workspace
  code cannot hang the in-process loop — a budget-exceeding parse aborts, resets
  the cached parser, and degrades to a recorded info, never a hang. A throwing
  scan becomes an error finding, the parsed tree is always freed, and it verifies
  doc-comment PRESENCE, never accuracy.
