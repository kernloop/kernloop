id: CLM-0155
statement: >-
  Reasoning nodes (every canonical-loop model node except the coder `implement`)
  invoke the agentic CLI tool-free WHERE THE CLI SUPPORTS IT — coverage is per-CLI
  and recorded (full/partial/none, #355 CLM-0158), NOT a uniform cross-adapter
  guarantee: claude is FULL — verified against the real CLI 2.1.183 that headless
  `-p` "don't ask mode" auto-denies every permission-gated tool (a reasoning
  invocation cannot read a planted sentinel), with `--disallowedTools` as
  defense-in-depth; codex is PARTIAL
  (already `-s read-only` — writes blocked, reads still allowed); opencode/ollama
  have NO run-level flag (no coverage — recorded, not faked). `--allowedTools` is
  NOT a fail-closed alternative on claude — it is additive auto-approve, not
  restrictive (verified). The coder keeps tools (it produces files).
evidence:
  - 'test:packages/kernel/src/adapters/definitions.test.ts::pure-completion (#148) disables tools per CLI, and is absent by default'
  - 'test:packages/cli/src/loop/node-model.test.ts::marks every node EXCEPT implement as a reasoning (tool-free) node'
  - 'code:packages/kernel/src/adapters/definitions.ts#pureCompletionArgs'
  - 'ci:test'
status: verified
owner: williamzujkowski
since: 0.6.0
