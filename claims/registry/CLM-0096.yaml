id: CLM-0096
statement: >-
  faculty-scrum decomposes a goal into an epic/story TaskContract tree with the
  parent-chain, the budget-sum invariant (per tokens/usd/wallClockMin), and
  altitude/track/sprint constraint tags, surfaced through the suggest-tier
  kernloop program decompose CLI as a preview that mutates nothing (no GitHub).
evidence:
  - 'test:packages/faculty-scrum/src/decompose.test.ts::derives id, parent, overlay, and clamped ceiling for each child'
  - 'test:packages/faculty-scrum/src/decompose.test.ts::emits a parseable altitude tag on each child and inherits parent constraints'
  - 'test:packages/faculty-scrum/src/decompose.test.ts::emits track/sprint tags when present and omits them when absent'
  - 'test:packages/faculty-scrum/src/decompose.test.ts::a token-sum violation throws ScrumBudgetExceededError naming the dimension'
  - 'test:packages/faculty-scrum/src/decompose.test.ts::a usd-sum violation throws for the usd dimension'
  - 'test:packages/faculty-scrum/src/decompose.test.ts::a wall-clock-sum violation throws for the wallClockMin dimension'
  - 'test:packages/faculty-scrum/src/decompose.test.ts::rejects a bad altitude in a spec with a typed error carrying the index'
  - 'test:packages/cli/src/program-commands.test.ts::prints the child tree with correct ids + altitude tags and audits the op'
  - 'test:packages/cli/src/program-commands.test.ts::audits goalChars only — never the goal verbatim'
  - 'test:packages/cli/src/program-commands.test.ts::a budget-breaching spec exits 1 with a clear message naming the breach'
  - 'test:packages/cli/src/program-commands.test.ts::a bad altitude exits 1 with a clear message'
  - 'code:packages/faculty-scrum/src/decompose.ts#decomposeGoal@doc:/CLM-0096/'
  - 'ci:test'
status: verified
owner: williamzujkowski
