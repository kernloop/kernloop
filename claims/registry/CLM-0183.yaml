id: CLM-0183
statement: >-
  The review-gate enforce promotion (#328 Inc2) is EVIDENCE-VERIFIED (#350): kernel
  assembly grants enforce only when a committed review-calibration artifact proves the
  gate met its PROMOTION_CRITERION (precision >= threshold over n >= windowN) AND was
  measured over the CURRENT review eval-set (bound by a hash, so a grown or changed set
  invalidates a stale measurement). A missing, malformed, stale, under-threshold, or
  under-window artifact is REFUSED — the gate STAYS ADVISORY and the refusal is audited
  (kernel.ladder.promotion-refused), so enforce is never granted on unverified or stale
  evidence. The composition root VERIFIES that the committed numbers meet the bar; it
  does NOT measure precision (constitutional rule 4) — that runs out-of-band via
  `kernloop calibrate`, which evaluates the default reviewer panel over the labeled
  eval-set and writes the artifact bound to the eval-set hash plus the adapter it was
  measured against. The eval-set is currently n=10 < windowN=50, so a real artifact
  honestly reports n below the window and kernloop's own review gate is not yet
  promotable (#478) — the mechanism is correct even while inert.
evidence:
  - 'test:packages/cli/src/review-calibration.test.ts::PASSES a committed artifact that meets the criterion and matches the eval-set'
  - 'test:packages/cli/src/review-calibration.test.ts::REFUSES when no artifact is committed (the common fresh-overlay case)'
  - 'test:packages/cli/src/review-calibration.test.ts::REFUSES a STALE artifact measured over a different eval-set (hash mismatch)'
  - 'test:packages/cli/src/review-calibration.test.ts::REFUSES below the precision threshold (0.7 < 0.8)'
  - 'test:packages/cli/src/review-calibration.test.ts::REFUSES below the sample window (n=10 < 50) — the honest state today (#478)'
  - 'test:packages/cli/src/kernel.test.ts::promotes the review gate to enforce when the ref is recorded AND the calibration evidence verifies (#350)'
  - 'test:packages/cli/src/kernel.test.ts::REFUSES the promotion (stays advisory) when the ref is recorded but NO calibration evidence exists (#350)'
  - 'test:packages/cli/src/calibrate-command.test.ts::runs the panel over the eval-set and writes an eval-set-bound artifact with provenance'
  - 'ci:test'
status: verified
owner: williamzujkowski
since: 0.9.0
