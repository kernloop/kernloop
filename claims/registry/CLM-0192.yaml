id: CLM-0192
statement: >-
  The sandbox provisions the workspace's DECLARED package manager into the
  scratch OFFLINE, so turbo — which re-invokes each package's script through the
  declared PM (`packageManager: pnpm@X` in the root package.json) — resolves that
  binary under `--network none` where the ratified image ships only node + npm +
  corepack (corepack cannot download). provisionPackageManager parses the
  `packageManager` field (stripping a `+integrity` suffix), locates the pinned
  dist in the HOST corepack cache (`$COREPACK_HOME` ?? `~/.cache/node/corepack`
  at `v1/<name>/<version>`), copies it via the shared cp -a --reflink=auto path
  (cpSync fallback) to `<scratch>/.kernloop-pm/<name>/`, and writes an
  executable (0755) POSIX shim `<scratch>/.kernloop-pm/bin/<name>` that execs
  node against the entry RESOLVED from the cached dist's own package.json `bin`
  field (never hardcoded; the resolved file's existence is verified — a broken
  cache throws LOUD). runCheckInSandbox calls the provisioner after
  populateScratch and BEFORE opening scratch perms; containerArgv PATH-prepends
  `/work/.kernloop-pm/bin` before `/work/node_modules/.bin` while keeping the
  top-level pnpm/yarn→npm-run translation. We PROVISION, never MUTATE the
  `packageManager` field (mutating would change the very workspace semantics the
  checks test). npm or an absent field is a NO-OP; a declared version missing
  from the host cache FAILS CLOSED as a spawnError naming
  `corepack prepare <name>@<version>` — never silently unsandboxed, never
  silently green. Fixes the class-3 environmental failure that made every
  turbo-routed gate check (typecheck/lint/test) fail in the #530 bootstrap
  dogfood run (#548, second instance after #546).
evidence:
  - 'test:packages/faculty-gates/src/sandbox/provision-pm.test.ts::parses pnpm@version and strips a +integrity suffix'
  - 'test:packages/faculty-gates/src/sandbox/provision-pm.test.ts::is a no-op (undefined) for npm, absent, or malformed fields'
  - 'test:packages/faculty-gates/src/sandbox/provision-pm.test.ts::honors COREPACK_HOME, else defaults under ~/.cache/node/corepack'
  - 'test:packages/faculty-gates/src/sandbox/provision-pm.test.ts::resolves the entry from the dist bin field and verifies it exists'
  - 'test:packages/faculty-gates/src/sandbox/provision-pm.test.ts::throws LOUD when the resolved entry file is absent (broken cache)'
  - 'test:packages/faculty-gates/src/sandbox/provision-pm.test.ts::resolves the entry, copies the dist, and writes a working shim'
  - 'test:packages/faculty-gates/src/sandbox/provision-pm.test.ts::fails CLOSED with an actionable message when the host cache lacks the version'
  - 'test:packages/faculty-gates/src/sandbox/provision-pm.test.ts::is a no-op (ok, nothing written) for an npm or absent declaration'
  - 'test:packages/faculty-gates/src/sandbox/run-check.test.ts::translates pnpm/yarn <script> → npm run <script>'
  - 'test:packages/faculty-gates/src/sandbox/run-check.test.ts::passes non-PM commands through (still PATH-wrapped, injection-safe argv)'
  - 'ci:test'
