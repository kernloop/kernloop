id: CLM-0122
statement: >-
  A spawned model-CLI adapter child receives a LEAST-PRIVILEGE environment, not the parent's whole
  `process.env` (#227, EPIC #47·P1): `scopedChildEnv` hands the child only the kernel's benign base
  allowlist (`SAFE_ENV_KEYS` — PATH/HOME/locale/tmp/XDG, proxy + CA-cert operational vars, and `LC_*`
  by prefix) UNION the caller's declared extras, dropping everything else — so other providers' API
  keys, `GH_TOKEN`/`GITHUB_TOKEN`, and cloud credentials in kernloop's own env are NOT exposed to a
  third-party agentic binary for exfiltration. `invokeAdapter` scopes the child env on every CLI spawn
  while still PATH-probing on the full env (a read, never a hand-off). The escape hatch is the overlay's
  `adapterEnvAllow` (env-var NAMES only — a stray literal value is inert, matching no var and dropped,
  never a stored secret), threaded by the CLI through every adapter-spawn path — the canonical loop's
  base + per-node seams and the author/distill/gate/forge tools — defaulting to `[]` (a login-authed
  CLI works on HOME alone; a key-authed one names its key var). The redaction is audited, never silent:
  a real run appends a `cli.run.env-scoped` event recording how many host vars were withheld. The
  api-endpoint (OpenAI-compatible HTTP) adapter is UNAFFECTED — it `fetch`es with one configured key
  and never spawns.
evidence:
  - 'test:packages/kernel/src/adapters/env.test.ts::keeps the benign base allowlist and drops everything else'
  - 'test:packages/kernel/src/adapters/env.test.ts::passes through caller-named extras (the adapterEnvAllow escape hatch)'
  - 'test:packages/kernel/src/adapters/env.test.ts::withholds a host secret from the child while keeping base vars'
  - 'test:packages/kernel/src/adapters/env.test.ts::passes an allowed extra through when named in envAllow'
  - 'test:packages/kernel/src/adapters/env.test.ts::returns the withheld names, sorted, excluding the allowlist'
  - 'test:packages/cli/src/loop/invoke.test.ts::withholds a host secret from the spawned CLI by default'
  - 'test:packages/cli/src/loop/invoke.test.ts::passes an extra named in envAllow through to the spawned CLI'
  - 'test:packages/cli/src/overlay.test.ts::defaults adapterEnvAllow to an empty list and accepts named extras [CLM-0122]'
  - 'code:packages/kernel/src/adapters/env.ts#scopedChildEnv@doc:/least-privilege child environment/'
  - 'ci:test'
status: verified
owner: williamzujkowski
