id: CLM-0120
statement: >-
  Every `[CLM-NNNN]` tag in README.md is a clickable link to a DERIVED, human-readable claims catalog,
  drift-checked and hand-edit-free (#219). render-claims generates two artifacts from the registry:
  (1) `docs/CLAIMS.md` — one anchored `## CLM-NNNN` section per claim carrying its status, statement,
  evidence (as resolving links), and a back-link to the YAML source; and (2) a block of markdown
  reference-link DEFINITIONS between the README's `claim-links` markers (`[CLM-NNNN]:
  docs/CLAIMS.md#clm-nnnn`), one per distinct claim the README's prose cites — so each existing bare
  `[CLM-NNNN]` shorthand becomes a link to its catalog section WITHOUT touching the 200+ inline tags.
  Both are regenerated by `pnpm claims:render` and a stale README block OR a stale `docs/CLAIMS.md`
  fails `--check` in CI. It also enforces honesty: a README that cites a `[CLM-NNNN]` with no registry
  file is a dangling tag (a doc that lies) and fails the gate. The link block is optional (a README
  without the markers is left untouched) and ids inside the generated block are excluded from the
  reference scan, so generation is stable and single-pass.
evidence:
  - 'test:scripts/__tests__/render-claims.test.mjs::referencedClaimIds collects DISTINCT prose tags, excluding the link block'
  - 'test:scripts/__tests__/render-claims.test.mjs::renderClaimLinks points each tag at its catalog anchor'
  - 'test:scripts/__tests__/render-claims.test.mjs::renderCatalog emits an anchored section per claim with status, statement, evidence, source'
  - 'test:scripts/__tests__/render-claims.test.mjs::danglingClaimIds flags a referenced id with no registry file'
  - 'test:scripts/__tests__/render-claims.test.mjs::main writes the link block, is --check green, and FAILS on a dangling tag'
  - 'code:scripts/render-claims.mjs#renderCatalog@doc:/human-readable claims catalog/'
  - 'code:scripts/render-claims.mjs#danglingClaimIds@doc:/a dangling tag the README must not carry/'
  - 'ci:test'
status: verified
owner: williamzujkowski
since: 0.9.0
