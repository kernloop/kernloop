id: CLM-0120
statement: >-
  Every `[CLM-NNNN]` tag in README.md is a clickable link to its claim, drift-checked and
  hand-edit-free (#219). render-claims generates a block of markdown reference-link DEFINITIONS
  (`[CLM-NNNN]: claims/registry/CLM-NNNN.yaml`) between the `claim-links` markers — one per distinct
  claim the README's prose cites — so each existing bare `[CLM-NNNN]` shorthand renders as a link
  WITHOUT touching the 200+ inline tags; the block is regenerated by `pnpm claims:render` and a stale
  block fails `--check` in CI exactly like the enforcement table. It also enforces honesty: a README
  that cites a `[CLM-NNNN]` with no registry file is a dangling tag (a doc that lies) and fails the
  gate. The block is optional — a README without the markers is left untouched — and ids inside the
  generated block itself are excluded from the reference scan, so generation is stable.
evidence:
  - 'test:scripts/__tests__/render-claims.test.mjs::referencedClaimIds collects DISTINCT prose tags, excluding the link block'
  - 'test:scripts/__tests__/render-claims.test.mjs::renderClaimLinks emits one reference definition per id'
  - 'test:scripts/__tests__/render-claims.test.mjs::danglingClaimIds flags a referenced id with no registry file'
  - 'test:scripts/__tests__/render-claims.test.mjs::main writes the link block, is --check green, and FAILS on a dangling tag'
  - 'code:scripts/render-claims.mjs#renderClaimLinks@doc:/reference-link definitions/'
  - 'code:scripts/render-claims.mjs#danglingClaimIds@doc:/a dangling tag the README must not carry/'
  - 'ci:test'
status: verified
owner: williamzujkowski
since: 0.9.0
