id: CLM-0132
statement: >-
  The quality gate ships a built-in MODEL-FREE security check over generated
  deliverable code (#277, #227 item 3, spec §5.3) — an always-on in-process scan
  (no external binary, so it never degrades to no-signal) wired into the DEFAULT
  check set as `security`, at the faculty's advisory tier. It is a CURATED
  high-confidence, low-false-positive smell detector, NOT exhaustive SAST: it flags
  dynamic code execution (`eval`/`new Function` with a NON-literal argument — a
  string literal is the safe form and is NOT flagged), shell-command injection (the
  SHELL-invoking `exec`/`execSync` with a non-literal command in a file that imports
  child_process — the argv-array `spawn`/`execFile` are safe and NEVER flagged), and
  known-FORMAT hardcoded secrets (AWS/GitHub/Google/Slack keys, PEM private keys),
  each as an advisory `error` Finding. It reads source as DATA (AST + regex, never
  executed), never throws on unparseable input, and reuses the shared
  no-symlink-follow walk + byte budgets so an untrusted workspace cannot escape the
  tree or OOM the loop. The broader external-tool (semgrep/secret-scan) tier is
  deferred (#276) until the binaries can be bundled into the gate sandbox.
evidence:
  - 'test:packages/docscan/src/security-scan.test.ts::flags eval() with a non-literal argument, but NOT eval of a string literal'
  - 'test:packages/docscan/src/security-scan.test.ts::flags new Function() with a non-literal body, but NOT an all-literal Function'
  - 'test:packages/docscan/src/security-scan.test.ts::flags exec()/execSync() with a non-literal command in a child_process file'
  - 'test:packages/docscan/src/security-scan.test.ts::does NOT flag a literal command, nor the argv-array spawn (the safe API)'
  - 'test:packages/docscan/src/security-scan.test.ts::does NOT flag regex .exec() in a file that never imports child_process'
  - 'test:packages/docscan/src/security-scan.test.ts::flags an AWS key, a GitHub token, and a PEM private key header'
  - 'test:packages/docscan/src/security-scan.test.ts::does NOT flag a benign string that lacks the credential format'
  - 'test:packages/docscan/src/security-scan.test.ts::never throws on unparseable generated code, and still scans secrets'
  - 'test:packages/docscan/src/security-scan.test.ts::never overflows the stack on a deeply-nested file that TS parses (#277 security round)'
  - 'test:packages/docscan/src/security-scan.test.ts::does NOT scan inside node_modules / build dirs (SKIP_DIRS)'
  - 'test:packages/docscan/src/security-scan.test.ts::never follows a symlink off the workspace tree'
  - 'test:packages/faculty-gates/src/checks.test.ts::default checks cover typecheck, lint, test, the doc-comment scan, and the security scan'
  - 'code:packages/docscan/src/security-scan.ts#scanSecuritySmells@doc:/CLM-0132/'
  - 'ci:test'
