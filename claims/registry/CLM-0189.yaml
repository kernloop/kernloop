id: CLM-0189
statement: >-
  The canonical loop's CHILD quality gate scopes its IN-PROCESS whole-workspace
  scans — the doc-comment check (#534) AND the security smell check (#541) — to
  the child's OWN written files, so pre-existing repo-wide findings (an
  undocumented legacy export, a detector fixture secret) cannot fail a child on
  content outside its file ownership. The loop's quality node passes the
  child's `writtenByChild` stash into the gate (the same files the
  diff-coverage check closes over, CLM-0134); `docCommentCheck` /
  `securityCheck` / `defaultQualityChecks` accept the optional scope, and
  `scanDocComments` / `scanSecuritySmells` PARSE only the scoped workspace
  paths (out-of-scope files are never read — not merely post-filtered), which
  for the doc scan also excludes out-of-scope tree-sitter files and
  honest-degradation notes. The stash is the UNION of the child's implement
  emissions across its iterations (last content wins per path) — a
  re-iteration that re-emits only some files can never narrow the scope past
  an earlier undocumented or smelly write. A PRESENT-but-empty scope (a child
  that wrote nothing) judges nothing; an ABSENT scope — the standalone `gate
  quality` path and every non-child gate run — keeps the whole-workspace
  semantics unchanged. RESUME FAILS CLOSED: the stash is not checkpointed, so
  a resume landing after implement has NO stash entry — the loop passes NO
  scope in that case (never a present-but-empty one), falling back to the
  whole-workspace scans: over-broad, but the enforcing checks can never
  silently skip files the child really wrote. Scope entries are CANONICALIZED
  against the workspace (resolve-then-relative, and the loop stashes the
  normalized relative paths `writeWorkspaceFiles` returns — a count mismatch
  throws, never a raw-path fallback), so an emitted absolute-but-inside path
  is still scanned rather than dodging a string compare. Passing the child's
  files for scoping never silently enables the opt-in diff-coverage check
  (CLM-0134): that stays behind its own `gates.quality.diffCoverage` flag,
  threaded as a separate request field.
evidence:
  - 'test:packages/docscan/src/doc-scan.test.ts::ignores an undocumented export OUTSIDE the scoped files'
  - 'test:packages/docscan/src/doc-scan.test.ts::still flags an undocumented export INSIDE the scoped files'
  - 'test:packages/docscan/src/doc-scan.test.ts::an omitted scope scans the whole tree (standalone gate semantics unchanged)'
  - 'test:packages/docscan/src/doc-scan.test.ts::scoping also excludes out-of-scope tree-sitter files and degradation notes'
  - 'test:packages/docscan/src/doc-scan.test.ts::an absolute scope entry inside the workspace still scopes correctly (canonicalized, still scanned)'
  - 'test:packages/docscan/src/security-scan.test.ts::scoped, ignores a pre-existing secret outside the written files (#541)'
  - 'test:packages/docscan/src/security-scan.test.ts::scoped, still flags a secret INSIDE a written file (#541)'
  - 'test:packages/docscan/src/security-scan.test.ts::an omitted scope keeps the whole-workspace security scan unchanged'
  - 'test:packages/faculty-gates/src/checks.test.ts::scoped to writtenFiles, ignores an undocumented export outside them'
  - 'test:packages/faculty-gates/src/checks.test.ts::unscoped, keeps the whole-workspace semantics (both exports flagged)'
  - 'test:packages/faculty-gates/src/checks.test.ts::defaultQualityChecks forwards the doc scope to the doc-comments check'
  - 'test:packages/faculty-gates/src/checks.test.ts::scoped to writtenFiles, ignores a pre-existing secret outside them (#541)'
  - 'test:packages/faculty-gates/src/checks.test.ts::unscoped, the security check keeps its whole-workspace semantics'
  - 'test:packages/faculty-gates/src/checks.test.ts::defaultQualityChecks forwards the child scope to the security check too (#541)'
