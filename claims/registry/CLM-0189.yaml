id: CLM-0189
statement: >-
  The canonical loop's CHILD quality gate scopes its IN-PROCESS whole-workspace
  scans — the doc-comment check (#534) AND the security smell check (#541) — to
  the child's OWN written files, so pre-existing repo-wide findings (an
  undocumented legacy export, a detector fixture secret) do not fail a child on
  content outside its file ownership. The loop's quality node passes the
  child's `writtenByChild` stash into the gate (the same files the
  diff-coverage check closes over, CLM-0134); `docCommentCheck` /
  `securityCheck` / `defaultQualityChecks` accept the optional scope, and
  `scanDocComments` / `scanSecuritySmells` PARSE only the scoped workspace
  paths (out-of-scope files are never read — not merely post-filtered), which
  for the doc scan also excludes out-of-scope tree-sitter files and
  honest-degradation notes. The stash is the UNION of the child's implement
  emissions across its iterations WITHIN A PROCESS LIFETIME (last content wins
  per path), so within one process a re-iteration that re-emits only some
  files does not narrow the scope past an earlier undocumented or smelly
  write. The in-process stash itself is NOT checkpointed, but the child's
  written PATHS now are (`ChildResult.writtenPaths`, #543/CLM-0199): on a
  RESUME the stash is rebuilt from that durable set BEFORE any gate runs, so
  the scoped semantics survive a kill/resume in the common case. Only when
  NEITHER the in-process stash NOR a checkpointed path set exists (a
  pre-#543 checkpoint, or a child whose implement never ran) does the gate
  fall back to the ORIGINAL fail-closed degradation: an ABSENT stash entry
  scans the whole workspace AND taints that child whole-workspace for the
  REMAINDER of the run (`scopeTaintedChildren`, itself process-local — a later
  resume re-taints via the same absent-stash path), so a fresh partial
  post-resume stash does not re-narrow the scope past pre-crash writes.
  SCOPE CARVE-OUTS, stated
  honestly: the request-level scope applies only to the DEFAULT check set — an
  explicit `checks` override is the caller's to scope; and a PRESENT-but-empty
  scope (a child that wrote nothing) disables BOTH in-process checks for that
  gate run, INCLUDING the security scan — the child owns no content. An ABSENT
  scope — the standalone `gate quality` path and every non-child gate run —
  keeps the whole-workspace semantics unchanged. Scope entries are
  CANONICALIZED against the workspace (resolve-then-relative, and the loop
  stashes the normalized relative paths `writeWorkspaceFiles` returns — a
  count mismatch throws, never a raw-path fallback), so an emitted
  absolute-but-inside path is still scanned rather than dodging a string
  compare. Passing the child's files for scoping never silently enables the
  opt-in diff-coverage check (CLM-0134): that stays behind its own
  `gates.quality.diffCoverage` flag, threaded as a separate request field.
