id: CLM-0098
statement: >-
  kernloop program emit files each decomposed child node as a labeled GitHub
  issue through the hardened tracker — dry-run by default, enforce-tier-gated
  (an --execute at suggest is refused and stays dry-run), issue-spam-guarded (a
  child count beyond the limit needs an explicit --confirm-count matching it),
  and audited once as cli.program.emit without the node goal/body verbatim. It
  mutates nothing in dry-run and re-uses the existing tracker (no new gh seam);
  an execute-mode createIssue failure is errors-as-data → a clean nonzero exit.
  emit has TWO mutually-exclusive modes: the ad-hoc --goal/--spec path
  re-decomposes and files; the LEDGER-DRIVEN --program <id> path files a
  persisted program's planned nodes from the STORED rows through the same gated
  tracker and AUTO-RECORDS each filed ref into the ledger (planned → emitted) on
  a real execute — idempotent (a re-emit skips already-emitted/done nodes and
  files nothing), still dry-run-default + enforce-gated + spam-guarded, an
  execute failure leaving the node planned, and a filed issue whose returned ref
  is unrecordable surfaced per-node WITH its ref (exit 1, node left planned) so a
  retry is a deliberate operator act, never a silent double-file.
evidence:
  - 'test:packages/cli/src/program-commands.test.ts::dry-run prints per-node proposals + mapped labels and spawns nothing'
  - 'test:packages/cli/src/program-commands.test.ts::refuses --execute at the suggest tier (stays dry-run, spawns nothing)'
  - 'test:packages/cli/src/program-commands.test.ts::files one issue per node at enforce with the mapped labels and prints the refs'
  - 'test:packages/cli/src/program-commands.test.ts::the spam guard refuses >20 nodes without --confirm-count, and proceeds with the exact count'
  - 'test:packages/cli/src/program-commands.test.ts::audits cli.program.emit once and never the node goal/body verbatim'
  - 'test:packages/cli/src/program-commands.test.ts::an execute-mode tracker failure exits 1 (errors-as-data, not a throw)'
  - 'test:packages/cli/src/program-emit-ledger.test.ts::--execute at enforce files one issue per node and AUTO-records each ref (planned → emitted)'
  - 'test:packages/cli/src/program-emit-ledger.test.ts::is idempotent: a second --execute files NOTHING, exits 0, reports skipped'
  - 'test:packages/cli/src/program-emit-ledger.test.ts::dry-run files nothing and leaves the ledger nodes planned (poisoned exec)'
  - 'test:packages/cli/src/program-emit-ledger.test.ts::an execute-mode failure on a node exits 1 and that node STAYS planned'
  - 'test:packages/cli/src/program-emit-ledger.test.ts::a filed issue with an unrecordable (non-https) ref is reported, exits 1, stays planned (#98)'
  - 'code:packages/cli/src/program-emit.ts#emitOp@doc:/CLM-0098/'
  - 'ci:test'
