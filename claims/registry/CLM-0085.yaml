id: CLM-0085
statement: >-
  When a loop node's tier resolves to a registered api endpoint, the composition root invokes it via
  the kernel api adapter, resolving the served concrete model and reasoning_effort through the same
  pure translation seam, recording the endpoint as the served adapter in provenance, and metering the
  call's reported tokens and usd into the run budget — and a per-endpoint maxUsdPerCall fails closed.
evidence:
  - 'test:packages/cli/src/loop/api-loop.test.ts::binds the endpoint as the served adapter and resolves the concrete model'
  - 'test:packages/cli/src/loop/api-loop.test.ts::invokes the endpoint (metered usage flows into the run totals)'
  - 'test:packages/cli/src/loop/api-loop.test.ts::fails closed (ApiKeyMissingError) when the endpoint key env var is unset'
  - 'test:packages/kernel/src/adapters/api.test.ts::fails closed when the reported cost exceeds the per-call cap'
  - 'test:packages/kernel/src/adapters/api.test.ts::allows a call whose reported cost is within the cap'
  - 'test:packages/cli/src/overlay.test.ts::loads the optional endpoints block and an adapter that references one [CLM-0083]'
  - 'ci:test'
status: verified
owner: williamzujkowski
since: 0.9.0
