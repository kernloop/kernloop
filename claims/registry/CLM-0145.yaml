id: CLM-0145
statement: >-
  An AGENTIC adapter is refused before launch when its workspace is a real git
  tree (#280 part 2 / #138, the P2 AppSec containment). An agentic adapter
  (claude/codex/gemini/opencode — the CLIs that execute generated code and
  read/write their cwd; ollama is pure-API and exempt) pointed at a NON-throwaway
  git working tree could poison `.git/hooks`, rewrite `.git/config`, or read
  tracked secrets — so `checkAgenticContainment` throws an
  `AgenticRepositoryWorkspaceError` at the kernel `invokeAdapter` choke point, the
  single funnel every caller (CLI loop, MCP, direct) passes through, so a
  cli-only guard cannot be bypassed. NON-throwaway = the realpath'd cwd is NOT
  under the realpath'd temp dir AND a `.git` exists at or above it (symlink-proof
  via realpath; a symlinked path into a real repo is still refused). On the loop
  path the refusal is AUDITED (`cli.adapter.refused`) before any node runs, not a
  silent throw (charter rule 7). It is pure path logic — the kernel stays
  model-free. SCOPE/HONESTY: the boundary is GIT-TREE containment, NOT general
  secret protection — a non-git directory holding a `.env` is NOT covered (a
  separate, larger scope). The contained adapter has no runtime opt-out it can
  reach (a security boundary, not a knob); escapes are copy-to-temp or `--sandbox
  docker` (#236); an audited overlay opt-out is deferred (#320). KNOWN GAP /
  TRUST ASSUMPTION: the throwaway carve-out is the OS temp dir and `os.tmpdir()`
  honors `$TMPDIR` — the contained model cannot set kernloop's launch env (the
  guard runs in the parent before the child spawns), but a LAUNCHER that points
  `$TMPDIR` at/above a working tree disables the carve-out's refusal for it, and a
  real repo cloned UNDER the temp dir is likewise treated as throwaway (location ≠
  provenance); deriving the carve-out from a kernloop-OWNED root is the hardening
  deferred to #332. An unresolvable temp dir fails closed (no carve-out).
evidence:
  - 'test:packages/kernel/src/adapters/containment.test.ts::REFUSES every agentic adapter in a non-throwaway git tree'
  - 'test:packages/kernel/src/adapters/containment.test.ts::ALLOWS a non-agentic adapter (ollama) in the same real git tree'
  - 'test:packages/kernel/src/adapters/containment.test.ts::partitions every adapter into agentic OR non-agentic — no adapter is unclassified'
  - 'test:packages/kernel/src/adapters/containment.test.ts::resolves symlinks: a symlink INTO a real git tree is still non-throwaway'
  - 'test:packages/kernel/src/adapters/containment.test.ts::is FALSE under the temp root (the hermetic-scratch carve-out, default tmpRoot)'
  - 'test:packages/cli/src/loop/finalize.test.ts::refuses a real agentic run in a git tree and audits cli.adapter.refused (rule 7)'
  - 'code:packages/kernel/src/adapters/containment.ts#checkAgenticContainment@doc:/CLM-0145/'
  - 'ci:test'
status: verified
owner: williamzujkowski
