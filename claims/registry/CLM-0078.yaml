id: CLM-0078
statement: >-
  Each model-calling loop node derives its ModelRequirement from the single template/manifest it
  routes to — no parallel map — and the composition root resolves that to the served adapter, model
  alias, effort arg, and per-call invoke TIMEOUT (via the overlay's per-tier adapter map and
  invokeTimeoutMs base — defaulting to the run adapter and a 15-min generative budget, capped shorter
  for the lighter nodes, #127). This binding holds on BOTH seam paths — the default CLI/api seam and
  the INJECTED seam the MCP-sampling run uses (#142), so a slow host model gets the node's real budget,
  not the MCP SDK's 60s request default. Then it names the served model+effort and any degradation in
  the node's Brief/Outcome provenance, and ATTRIBUTES that node's metered spend to the serving adapter
  in the run cost's `byAdapter` breakdown, so a tiered run's spend is observable per adapter (#44).
evidence:
