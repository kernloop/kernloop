id: CLM-0137
statement: >-
  The canonical loop emits IN-FLIGHT spend: every node executor is wrapped so it
  appends a `loop.spend` audit event WHENEVER that node actually spent (delta >
  0), carrying the per-node token/usd delta AND the cumulative run total
  (EPIC #47·P5 #230). An operator tailing the audit log (or `watch`, which now
  renders the event) sees cost accumulate as the run progresses instead of only
  in the final report. The event is appended in a `finally`, so a node that
  spends then THROWS still records spend-to-failure before the error propagates.
  A zero-spend node appends NOTHING — the design vote's load-bearing condition:
  the financial audit chain is not polluted with heartbeat noise. It is
  observe-tier telemetry (it records, it never acts) and reuses the existing
  free-form kernel audit append, so no contract or kernel change was needed.
evidence:
  - 'test:packages/cli/src/loop/spend-audit.test.ts::emits delta + cumulative per spending node, monotonic across nodes, chain intact'
  - 'test:packages/cli/src/loop/spend-audit.test.ts::a zero-spend node appends NOTHING — no audit-chain pollution'
  - 'test:packages/cli/src/loop/spend-audit.test.ts::records spend-to-failure when a node spends then THROWS (finally), and rethrows'
  - 'test:packages/cli/src/loop/spend-audit.test.ts::attributes spend to the child inside the fan-out (childId)'
  - 'test:packages/cli/src/tools/watch.test.ts::renders each significant type readably and skips noise'
  - 'code:packages/cli/src/loop/executors-nodes.ts#withSpendAudit@doc:/CLM-0137/'
  - 'ci:test'
status: verified
owner: williamzujkowski
