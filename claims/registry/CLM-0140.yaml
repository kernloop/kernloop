id: CLM-0140
statement: >-
  The canonical loop ATTRIBUTES its outcome to the skills it reused (EPIC #47·P3
  #228 constituent 2 — the MEASURE half of the learning loop #309 wired). On
  retrospect the loop reads the skills whose BODY survived the token budget into
  the brief (the `skillBodies` section's `skill:<name>:body` provenance) and, for
  each, records the run's Outcome against a `skill:<name>` subject in the observer
  fitness ledger, appending one `loop.skill.attributed` audit event. A body the
  budget DROPPED (never presented to the model) is NOT attributed; a `proposed/`
  skill is never injected so never attributed (CLM-0050); attribution fires
  EXACTLY ONCE per run (idempotent across a resume that re-runs retrospect). It is
  records-ONLY and safe for the no-auto-promote ladder: `ingestOutcome` only
  UPSERTs aggregate stats, a `skill:<name>` subject feeds only the SUGGEST-tier
  lifecycle (human-ratified) and is INERT for routing (it is never a registered
  manifest, so never a routing candidate). HONESTY BOUNDARY: this is a
  CORRELATIONAL signal — "a run whose brief carried skill X had outcome O" — NOT a
  causal claim; when several skills survive, the single whole-loop Outcome is
  credited to EACH (a co-occurrence confound), so a per-skill rate is "rate of
  runs that carried the skill", read by a human, never auto-acted. This claims the
  ATTRIBUTION WIRING, not that the signal proves a skill's value.
evidence:
  - 'test:packages/cli/src/loop/skill-attribution.test.ts::returns nothing when the body was DROPPED by the budget (never presented ⇒ never attributed)'
  - 'test:packages/cli/src/loop/skill-attribution.test.ts::records a correlational fitness row + an audit event, and the skill is INERT for routing'
  - 'test:packages/cli/src/loop/skill-attribution.test.ts::fires EXACTLY ONCE per run — a re-run (resume) does not double-count'
  - 'test:packages/cli/src/loop/skill-attribution.test.ts::attributes nothing (no row, no event) when no skill body reached the brief'
  - 'test:packages/cli/src/loop/skill-attribution.test.ts::a run whose brief carried a live skill records that skill against the outcome'
  - 'code:packages/cli/src/loop/skill-attribution.ts#attributeSkillFitness@doc:/CLM-0140/'
  - 'ci:test'
