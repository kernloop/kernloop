id: CLM-0159
statement: >-
  A panel-7 RATIFICATION vote convenes a PROVIDER-DIVERSE panel (#369): the
  composition root round-robins the voters across the overlay's distinct available
  adapters (stable-sorted, deterministic) and binds each voter to its OWN adapter's
  seam, so the panel is not one model role-playing N personas (the correlated-oracle
  weakness). Each ballot records the normalized served:ModelIdentity that cast it on
  the VoterRecord, so independence is VERIFIABLE. When fewer than 2 distinct adapters
  are available the panel runs single-oracle but surfaces it honestly — a visible
  single-oracle WARN finding on the Verdict AND a cli.vote.single-oracle-degraded
  audit (rule 7), never silent. Panel-3 loop votes stay single-adapter (no served,
  byte-identical). The faculty stays model-free; the cli owns per-voter routing.
evidence:
  - 'test:packages/faculty-gates/src/vote/run.test.ts::records each voter served identity and flags no skew on a fully diverse panel'
  - 'test:packages/faculty-gates/src/vote/run.test.ts::emits a SINGLE-ORACLE warn finding when all ballots collapse to one class'
  - 'test:packages/cli/src/loop/vote-executor.test.ts::convenes a PROVIDER-DIVERSE panel-7: distinct served per voter, no single-oracle'
  - 'test:packages/cli/src/loop/vote-executor.test.ts::DEGRADES a panel-7 with one adapter: single-oracle finding + audit'
  - 'test:packages/cli/src/loop/vote-executor.test.ts::two UNCATALOGUED adapters (codex + opencode) do NOT collapse to a single oracle (#381)'
  - 'test:packages/cli/src/loop/node-seam.test.ts::voterServedIdentity disambiguates an unknown class by ADAPTER so two uncatalogued adapters stay distinct (#381)'
  - 'test:packages/cli/src/loop/vote-executor.test.ts::panel-3 loop votes stay single-adapter (no served) even with diversity available'
  - 'test:packages/cli/src/loop/vote-diversity.test.ts::dedups the run adapter, excludes endpoints + non-CLI names, and stable-sorts'
  - 'code:packages/cli/src/loop/seams.ts#diverseBallotInvoker'
  - 'ci:test'
status: verified
owner: williamzujkowski
since: 0.6.0
