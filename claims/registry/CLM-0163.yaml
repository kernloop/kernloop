id: CLM-0163
statement: >-
  The Antigravity CLI adapter `agy` (#387) — Google's replacement for the
  deprecated individual `gemini` CLI — is wired as the sixth kernel adapter and
  drives Antigravity print mode: `buildCommand` emits `agy -p <prompt> --model
  <name>`, parsing the PLAIN-TEXT response (no JSON envelope) with NO usage, so
  the call is metered `false` rather than guessed. It is harness-routed with its
  own auto-router; tiers bind to the verbatim Gemini model names `agy models`
  lists (frontier→`Gemini 3.1 Pro (High)` … small→`Gemini 3.5 Flash (Low)`).
  Effort is BAKED INTO the model name (Low/Medium/High/Thinking), not a separate
  flag, so the adapter declares no effort profile and effort is dropped honestly.
  Its pure-completion coverage is `none` and SO DECLARED: `agy`'s only restriction
  flag, `--sandbox`, blocks exec/network but NOT fs read/write (verified), so a
  `pureCompletion` request adds no argv and is best-effort, audited — never a
  silent or fabricated tool-free guarantee. It is classified AGENTIC (cwd-using)
  for containment, and marked `experimental` (it self-updates in the background).
evidence:
  - 'test:packages/kernel/src/adapters/translate.test.ts::agy (Antigravity, #387) is harness-routed: Gemini tier names, NO effort param'
  - 'test:packages/kernel/src/adapters/definitions.test.ts::pureCompletionCoverage (#355) classifies each adapter, in lockstep with the argv'
  - 'test:packages/kernel/src/adapters/definitions.test.ts::defines exactly the five spec §3.1 adapters'
  - 'ci:test'
status: verified
owner: williamzujkowski
since: 0.6.0
