id: CLM-0014
statement: >-
  The event bus delivers only the five frozen contracts: publishing a malformed or unknown message type is rejected at the boundary.
evidence:
  - 'test:packages/kernel/src/bus/event-bus.test.ts::rejects publishing an unknown contract name with a typed error'
  - 'test:packages/kernel/src/bus/event-bus.test.ts::rejects a schema-invalid message at the publish boundary with a typed error'
  - 'test:packages/kernel/src/bus/event-bus.test.ts::delivers a valid contract message to a subscriber'
status: verified
owner: williamzujkowski
since: 0.2.0
