id: CLM-0064
statement: >-
  The canonical loop runs a review gate per child after the quality gate
  (implement then quality then review). BY DEFAULT the review Verdict is
  advisory, audited, and does not drive re-iteration or block integration; it
  drives child re-iteration ONLY when the review gate is promoted to enforce via
  a ratified ladder transition (per-overlay, never a default).
evidence:
  - 'test:packages/workflows/src/graph.test.ts::declares the spec §6 shape: the chain, the vote branch, and the child sub-chain'
  - 'test:packages/cli/src/loop/gates-in-loop.test.ts::reviews the child diff, returns an advisory Verdict, and audits it'
  - 'test:packages/cli/src/loop/gates-in-loop.test.ts::is advisory but SURFACED: a rejecting review adds a needs-review signal without failing the run (#226 item 5)'
  - 'test:packages/workflows/src/child-iterate.test.ts::the review gate is advisory: a rejecting review does NOT re-run implement by default'
  - 'test:packages/workflows/src/child-iterate.test.ts::with reviewDrivesIteration on (review at enforce), a review reject re-runs implement'
  - 'test:packages/cli/src/kernel.test.ts::promotes the review gate to enforce when the ref is recorded AND the calibration evidence verifies (#350)'
  - 'ci:test'
status: verified
owner: williamzujkowski
since: 0.5.0
