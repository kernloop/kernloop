id: CLM-0166
statement: >-
  An overlay can PIN a concrete per-tier model onto a built-in CLI adapter via
  the `adapterModels` block (`{ <cli-adapter>: { <tier>: <model> } }`, #393) —
  the agentic-CLI counterpart to the `endpoints` per-tier `models` (direct HTTP).
  A harness-routed CLI (opencode) defaults every tier to the harness default
  (`''`, its own auto-router); a pin merges OVER the adapter's `tierBinding` in
  `resolveServed`, so kernloop runs `opencode -m <model>` for a kernloop-CHOSEN
  model on a pinned tier while an UNpinned tier keeps the adapter default
  (merge, not replace — so downward degradation against the adapter's own bound
  tiers is preserved). The pin is CLI-only (`adapterModelOverride` is inert for
  an endpoint id, which carries its own `models`), and the schema rejects a pin
  keyed by a name that is not a built-in CLI adapter. The SAME override threads
  the selector's PREDICTION (`resolveServedFor`) and node-bind's CALL-TIME
  binding, so predicted==served holds under a pin (the CLM-0130 honesty
  invariant): live-fitness can never credit a model that did not serve.
evidence:
  - 'test:packages/cli/src/loop/adapter-model-pin.test.ts::pins opencode’s large tier to a kernloop-chosen model (was harness default "")'
  - 'test:packages/cli/src/loop/adapter-model-pin.test.ts::an UNpinned tier keeps the adapter default — the pin merges over, not replaces'
  - 'test:packages/cli/src/loop/adapter-model-pin.test.ts::is inert for a non-CLI name (an endpoint id carries its own models)'
  - 'test:packages/cli/src/loop/adapter-model-pin.test.ts::prediction equals call-time binding under a pin (CLM-0130)'
  - 'test:packages/cli/src/overlay.test.ts::adapterModels is absent by default and parses a per-tier CLI model pin (#393, CLM-0166)'
  - 'test:packages/cli/src/overlay.test.ts::adapterModels rejects an unknown adapter key — a pin must name a real CLI adapter (#393)'
  - 'ci:test'
status: verified
owner: williamzujkowski
since: 0.6.0
