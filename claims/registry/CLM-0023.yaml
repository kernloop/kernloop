id: CLM-0023
statement: >-
  Semantic recall ranks facts by provenance and recency, and unrefreshed facts decay below fresher ones.
evidence:
  - 'test:packages/faculty-memory/src/semantic.test.ts::ranks an unrefreshed older fact below a fresher equally-relevant one'
  - 'test:packages/faculty-memory/src/semantic.test.ts::re-remembering an identical fact resets its decay clock'
  - 'test:packages/faculty-memory/src/semantic.test.ts::decays a fact by half per half-life'
  - 'ci:test'
status: verified
owner: williamzujkowski
since: 0.2.0
