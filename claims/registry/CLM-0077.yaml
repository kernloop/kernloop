  - 'test:packages/cli/src/tools/run-budget-honesty.test.ts::AUDITS the ENDPOINT half: a metersUsd:false endpoint has the same silently-inert usd cap (#470)'
  - 'test:packages/cli/src/tools/run-budget-honesty.test.ts::does NOT audit a metersUsd:true endpoint (its own #393 handling enforces the cap)'
  - 'test:packages/kernel/src/adapters/definitions.test.ts::marks only claude as metering USD — the others report tokens-or-nothing (#462)'
  - 'test:packages/kernel/src/adapters/definitions.test.ts::marks token-metering honestly: claude/codex/opencode yes, ollama/agy no (#462)'
  - 'test:packages/cli/src/tools/run-budget-honesty.test.ts::audits HONESTLY for a fully-unmetered adapter (agy): NEITHER budget applies, not "token budget still applies" (#462)'
  - 'test:packages/cli/src/tools/run-budget-honesty.test.ts::AUDITS + RETURNS a warn finding when a usd budget runs on a non-metering adapter (codex) — never silently inert (#463)'
  - 'test:packages/cli/src/tools/run-budget-honesty.test.ts::does NOT audit (and returns no finding) when the adapter meters usd (claude)'
  - 'test:packages/cli/src/loop-iteration.test.ts::surfaces the inert-usd-cap as a VISIBLE run finding (not only an audit) on a non-metering adapter [CLM-0077, #463]'
  - 'test:packages/cli/src/tools/run-budget-honesty.test.ts::does NOT audit in unlimited mode (the usd budget is not enforced anyway)'
  - 'test:packages/cli/src/tools/run-budget-honesty.test.ts::does NOT audit when there is no usd budget (usd: 0)'
  - 'test:packages/workflows/src/child-budget.test.ts::a bounded run that exceeds its budget escalates (resumable), not silently continues'
  - 'test:packages/workflows/src/child-budget.test.ts::an unlimited run that exceeds the nominal budget COMPLETES and never halts on budget'
  - 'test:packages/workflows/src/child-budget.test.ts::an over-budget enforce run escalates a child before Kc instead of re-iterating'
  - 'test:packages/cli/src/loop-iteration.test.ts::an UNLIMITED run that exceeds the nominal budget COMPLETES, still reports full cost, and is recorded as unlimited'
  - 'test:packages/cli/src/loop-iteration.test.ts::a bounded (enforce) run that exceeds its budget escalates and is resumable, never silently continuing'
  - 'test:packages/cli/src/overlay.test.ts::loads Kc and budgetMode from the file; rejects an invalid mode [CLM-0043, CLM-0077]'
  - 'test:packages/cli/src/cli.test.ts::run --budget parses tokens=N,usd=N,wallClock=N into the task budget [CLM-0077]'
  - 'test:packages/cli/src/cli.test.ts::run --unlimited is accepted (forces unlimited budget mode) [CLM-0077]'
