id: CLM-0077
statement: >-
  Budget enforcement is a run-level MODE, not a contract change: in enforce mode (default) a run
  whose metered spend exceeds its parent budget escalates and halts (resumable) rather than silently
  continuing; in unlimited mode the budget never halts the run, but usage and cost are STILL metered
  and reported identically, and the run is recorded honestly as having run without budget enforcement.
  HONESTY at the metering boundary (#462): a `usd` budget can only be enforced on an adapter that
  reports per-call dollar cost (`metersUsd: true` — claude via `total_cost_usd`); a CLI adapter that
  reports only tokens or nothing (codex/agy/opencode/ollama, `metersUsd: false`) would read $0 spend,
  so an enforce-mode run with a usd budget on such an adapter has a SILENTLY-INERT cap. Rather than
  lie, the run AUDITS `cli.budget.usd-unenforceable` (rule 7) — surfacing the degradation, not failing
  closed. The audit reason reflects REALITY per adapter via the companion `metersTokens` fact:
  codex/opencode meter TOKENS (so the token budget still bounds the run), but agy/ollama meter NEITHER
  usd NOR tokens (`metersTokens: false`) — for those, BOTH budgets are inert and only wallClock + the
  Kc iteration cap bound the run, which the audit states honestly rather than falsely claiming a token
  budget applies. `metersUsd`/`metersTokens` are single-sourced per-adapter facts on the kernel adapter
  definition. The SAME inert-cap class is surfaced for a registered ENDPOINT (#470): an endpoint with
  `metersUsd: false` (the default) reports $0 and applies no ceiling, so a usd budget on it is equally
  inert — the audit fires with `metersTokens: null` (an endpoint meters tokens only when its 2xx returns
  OpenAI-compatible `usage.*`, which is runtime-dependent, so the reason says so honestly rather than
  asserting a static fact); a `metersUsd: true` endpoint keeps its own fail-closed handling (#393). The
  audit is GATED to the `workflow.canonical` capability (#469): only the canonical loop wires the runtime
  budget guard and makes adapter model calls, so only there is a usd budget actually consulted — a non-loop
  capability (memory read / gate.quality / brief.compile) consults no budget, and auditing it inert would be
  a misleading record, exactly the lie this audit exists to prevent. Beyond the durable audit, the
  degradation is ALSO surfaced as a VISIBLE `warn` finding on the run result (#463) — prepended to the
  canonical-loop Outcome/escalation findings — so an operator who set a $-cap sees at decision time that it
  is not enforced, rather than only on later inspection of the audit log.
evidence:
