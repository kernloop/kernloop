id: CLM-0135
statement: >-
  The review gate can judge GOAL-FIDELITY, not only code defects (#226 item 3, EPIC
  #47·P1): under an explicit OPT-IN `gates.review.groundedness` (default OFF — an
  UNPROVEN model-judge, off ⇒ byte-identical to before) the canonical loop threads
  the child's task GOAL + its definitionOfDone acceptance criteria into the review
  CONTEXT shared with every reviewer, and — when a goal/context exists — convenes a
  GROUNDEDNESS reviewer lens whose rubric judges whether the diff achieves the goal
  and cites which acceptance criteria it satisfies/violates. It is ADVISORY: a goal-mismatch reject surfaces as a non-blocking
  needs-review Outcome signal (CLM-0133), never auto-failing the run. A model
  judging goal-fidelity is self-grading-prone, so this claims ONLY the WIRING — the
  goal is threaded, the groundedness lens is convened, and a reject is surfaced —
  NOT that the reviewer RELIABLY detects goal-mismatch; the real precision is
  measured by a separate live eval and never trusted blind (#287). The hermetic
  golden eval (#286) asserts the wiring (a groundedness reject flows to a
  needs-review signal), not the model's judgment.
evidence:
  - 'test:packages/cli/src/loop/gates-in-loop.test.ts::threads the child GOAL + acceptance criteria into the review context (#226 item 3)'
  - 'test:packages/cli/src/overlay.test.ts::gates.review.groundedness is opt-in: default off, parses an explicit true [CLM-0135]'
  - 'test:packages/cli/src/loop/gates-in-loop.test.ts::is advisory but SURFACED: a rejecting review adds a needs-review signal without failing the run (#226 item 5)'
  - 'code:packages/faculty-gates/src/review/reviewers.ts#REVIEWER_GROUNDEDNESS@doc:/CLM-0135/'
  - 'ci:test'
