name: CI

on:
  push:
    branches: [main, 'phase/**']
  pull_request:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      # Wiring-complete gate (spec §1.1): no stub/TODO/not-implemented marker
      # survives in shipped package source.
      - run: pnpm wiring:check
      - run: pnpm format
      - run: pnpm test
      # Ran-and-passed gate: proves every claim's cited test actually executed
      # and passed in this run — not merely that its name exists in a file.
      - run: pnpm claims:verify-ran

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The e2e suite drives the REAL built CLI as a subprocess — build first.
      - run: pnpm build
      # End-to-end functional gate: the AGILE pipeline + the hard invariants
      # against a hermetic gh stub (no network, no real GitHub).
      - run: pnpm e2e

  evals:
    name: evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The eval harness imports the workspace packages in-process, so their dist
      # must exist (the `@kernloop/*` exports resolve to built output).
      - run: pnpm build
      # Golden quality eval-set (#226 item 4): drives the REAL canonical loop with
      # a scripted (model-free) invoke + a real tsc gate — makes VETTED measurable.
      - run: pnpm evals

  claims_check:
    name: 'claims:check'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm claims:check
      # The README enforcement table is generated, never hand-edited — fail
      # if it drifts from the registry.
      - run: node scripts/render-claims.mjs --check
      # docs/API.md is DERIVED from each gated package's JSDoc — fail if the
      # committed reference drifted from the source comments (#51).
      - run: pnpm docs:render -- --check
      # Doc-coverage gate (#64): every value export of a gated package must
      # carry a real, non-placeholder doc-comment.
      - run: pnpm docs:coverage
      # Stats-drift gate (#189): the README at-a-glance block + every WATCHED
      # prose count must match the value DERIVED from the canonical code const.
      - run: pnpm stats:check
      # Parsimony-rule drift gate (#417): the per-harness copies + SKILL.md under
      # skills/parsimony-restraint/ are GENERATED from the single source
      # `COMPACT_PARSIMONY_RULE` in @kernloop/parsimony — fail if any committed
      # copy diverges from it.
      - run: pnpm build
      - run: pnpm parsimony:render -- --check

  governance:
    name: governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node scripts/governance-check.mjs

  audit-selftest:
    name: audit-selftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm audit:selftest
