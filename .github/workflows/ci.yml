name: CI

on:
  push:
    branches: [main, 'phase/**']
  pull_request:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      # Wiring-complete gate (spec §1.1): no stub/TODO/not-implemented marker
      # survives in shipped package source.
      - run: pnpm wiring:check
      - run: pnpm format
      - run: pnpm test
      # Ran-and-passed gate: proves every claim's cited test actually executed
      # and passed in this run — not merely that its name exists in a file.
      - run: pnpm claims:verify-ran

  claims_check:
    name: 'claims:check'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm claims:check
      # The README enforcement table is generated, never hand-edited — fail
      # if it drifts from the registry.
      - run: node scripts/render-claims.mjs --check
      # docs/API.md is DERIVED from each gated package's JSDoc — fail if the
      # committed reference drifted from the source comments (#51).
      - run: pnpm docs:render -- --check
      # Doc-coverage gate (#64): every value export of a gated package must
      # carry a real, non-placeholder doc-comment.
      - run: pnpm docs:coverage

  governance:
    name: governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node scripts/governance-check.mjs

  audit-selftest:
    name: audit-selftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm audit:selftest
