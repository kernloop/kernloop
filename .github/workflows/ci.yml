name: CI

on:
  push:
    branches: [main, 'phase/**']
  pull_request:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      # Wiring-complete gate (spec §1.1): no stub/TODO/not-implemented marker
      # survives in shipped package source.
      - run: pnpm wiring:check
      - run: pnpm format
      - run: pnpm test
      # Ran-and-passed gate: proves every claim's cited test actually executed
      # and passed in this run — not merely that its name exists in a file.
      - run: pnpm claims:verify-ran

  claims_check:
    name: 'claims:check'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm claims:check

  governance:
    name: governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node scripts/governance-check.mjs

  audit-selftest:
    name: audit-selftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm audit:selftest
